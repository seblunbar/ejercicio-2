<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebXR Scene</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script>
      AFRAME.registerComponent('music-on-click', {
        init: function () {
          const el = this.el;
          el.classList.add('clickable');
          
          el.addEventListener('click', function () {
            if (el.components.sound) {
              el.components.sound.playSound();
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      <a-assets>
        <a-asset-item id="ars" src="ars.glb"></a-asset-item>
        <audio id="musica" src="musica.mp3" preload="auto"></audio>
      </a-assets>

      <a-entity
        gltf-model="#ars"
        animation-mixer="clip: Scene; loop: repeat"
        position="0 1.5 -8"
        scale="0.5 0.5 0.5"
        rotation="0 180 0"
        music-on-click
        sound="src: #musica; autoplay: false">
      </a-entity>

      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </body>
</html>
