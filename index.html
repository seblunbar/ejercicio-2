<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Autonomous Robot Sweeper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('play-music-on-click', {
      init: function () {
        const el = this.el;
        el.classList.add('clickable');

        el.addEventListener('click', function () {
          const soundComponent = el.components.sound;
          
          if (soundComponent) {
            // Reproducir o pausar si ya está sonar
            if (soundComponent.isPlaying) {
              soundComponent.pauseSound();
            } else {
              soundComponent.playSound();
            }
          }
        });
      }
    });
  </script>
</head>
<body>

  <a-scene
    webxr="optionalFeatures: hit-test, local-floor, dom-overlay"
    xr-mode-ui="XRMode: ar"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <a-assets timeout="10000">
      <a-asset-item id="ars" src="autonomous_robot_sweeper.glb"></a-asset-item>
      <!-- Definición del archivo de audio en los assets -->
      <audio id="musica" src="Invierno_Allegro_estilo_Vivaldi 1.mp3" preload="auto"></audio>
    </a-assets>

    <a-entity camera look-controls position="0 1.6 0">
      <a-entity cursor="fuse: false" position="0 0 -1" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <a-entity
      gltf-model="#ars"
      animation-mixer="clip: *; loop: repeat"
      position="0 1.5 -8"
      scale="0.5 0.5 0.5"
      rotation="0 180 0"
      play-music-on-click
      sound="src: #musica; autoplay: false; on: null">
    </a-entity>

    <a-light type="ambient" intensity="0.9"></a-light>
    <a-light type="directional" intensity="0.6" position="1 3 2"></a-light>

  </a-scene>

</body>
</html>
