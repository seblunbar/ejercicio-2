<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Autonomous Robot Sweeper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('play-music-on-click', {
      init: function () {
        const el = this.el;
        el.classList.add('clickable');
        el.addEventListener('click', function () {
          const soundComponent = el.components.sound;
          if (soundComponent) {
            if (soundComponent.isPlaying) {
              soundComponent.pauseSound();
            } else {
              soundComponent.playSound();
            }
          }
        });
      }
    });
  </script>
</head>
<body>

  <a-scene
    webxr="optionalFeatures: hit-test, local-floor, dom-overlay"
    xr-mode-ui="XRMode: ar"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <a-assets timeout="10000">
      <a-asset-item id="ars" src="autonomous_robot_sweeper.glb"></a-asset-item>
      <audio id="musica" src="Invierno_Allegro_estilo_Vivaldi 1.mp3" preload="auto"></audio>
    </a-assets>

    <a-entity camera look-controls wasd-controls position="0 1.6 0">
      <a-entity cursor="fuse: false" position="0
